{{ if hugo.IsMultilingual }}
<nav aria-label="{{ i18n "ariaLanguage" }}" class="language-switcher">
  <label for="language-select" class="sr-only">{{ i18n "ariaLanguage" }}</label>
  <select id="language-select" aria-label="{{ i18n "ariaLanguage" }}" onchange="if(this.value) window.location.href=this.value">
    {{ range .Site.Languages }}
      {{ $abs := printf "%s%s/" $.Site.BaseURL .Lang }}
      <option value="{{ $abs }}" {{ if eq . $.Site.Language }}selected{{ end }}>{{ .LanguageName }}</option>
    {{ end }}
  </select>
</nav>
{{ end }}

<script>
// Minimal accessible behaviour for the language switcher
(function(){
  var widget = document.querySelector('[data-js="lang-switcher"]');
  if(!widget) return;
  var btn = widget.querySelector('[data-js="toggle"]');
  var list = widget.querySelector('[data-js="list"]');
  var items = widget.querySelectorAll('.language-switcher__item');

  function close(){ btn.setAttribute('aria-expanded','false'); list.hidden = true; }
  function open(){ btn.setAttribute('aria-expanded','true'); list.hidden = false; list.focus(); }

  btn.addEventListener('click', function(e){
    if(list.hidden) open(); else close();
  });

  items.forEach(function(it){
    it.addEventListener('click', function(){
      var url = this.getAttribute('data-url');
      if(url) window.location.href = url;
    });
  });

  // set initial flag in button
  var current = widget.querySelector('.language-switcher__item[data-lang="' + document.documentElement.lang.split('-')[0] + '"]');
  if(!current) current = widget.querySelector('.language-switcher__item[aria-selected]') || widget.querySelector('.language-switcher__item');
  if(current){
    var flag = current.querySelector('.language-switcher__flag');
    var btnFlag = btn.querySelector('.language-switcher__flag');
    if(flag && btnFlag){ btnFlag.innerHTML = flag.innerHTML; }
  }
  // close on outside click
  document.addEventListener('click', function(e){ if(!widget.contains(e.target)) close(); });
})();
</script>
